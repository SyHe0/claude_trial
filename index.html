<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cop Chase Run</title>
<style>
  html,body{margin:0;height:100%;background:#120a22;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,5,25,.55);color:#fff;text-align:center;}
  .card{background:rgba(25,14,50,.92);border:2px solid #ff7a00;border-radius:16px;padding:28px 36px;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  h1{margin:0 0 8px;font-size:34px;letter-spacing:2px;color:#ffb703;}
  p{margin:8px 0;line-height:1.5;color:#e6dcff;}
  .keys b{display:inline-block;background:#3b2a66;border-radius:6px;padding:1px 8px;margin:0 2px;}
  button{margin-top:14px;font-size:20px;font-weight:700;padding:12px 34px;border:0;border-radius:10px;background:#ff7a00;color:#fff;cursor:pointer;}
  button:hover{background:#ff9a33;}
  small{display:block;margin-top:12px;color:#9c8fc4;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <div class="card">
    <h1 id="title">COP CHASE RUN</h1>
    <p id="msg" class="keys">
      <b>&larr;</b> <b>&rarr;</b> change lane<br>
      <b>&uarr;</b> jump over low barriers<br>
      <b>&darr;</b> slide under high bars<br>
      Dodge crates by switching lanes.<br>
      One wrong move and the cop catches you!
    </p>
    <button id="btn">START</button>
    <small>Press SPACE or ENTER &middot; On phones: swipe to move</small>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const msgEl = document.getElementById('msg');
const btn = document.getElementById('btn');

// ---------- layout / projection ----------
const ZMAX = 90, D = 14;
let W, H, U, HY, GY, CX, dpr;
let skyline = [];
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  U = Math.min(W / 4.2, H * 0.26);
  HY = H * 0.32; GY = H * 0.8; CX = W / 2;
}
const sc = z => 1 / (1 + z / D);
const sy = s => HY + (GY - HY) * s;
const sx = (wx, s) => CX + wx * U * s;

function makeSkyline() {
  skyline = [];
  let x = 0;
  while (x < 1.05) {
    const w = 0.02 + Math.random() * 0.04;
    skyline.push({ x, w, h: 0.04 + Math.random() * 0.14 });
    x += w;
  }
}

// ---------- game state ----------
let state = 'menu';
let P, C, obstacles = [], B = [];
let speed = 12, time = 0, score = 0, dist = 0, spawnDist = 45, crashT = 0, overAt = 0;
let best = 0;
try { best = +localStorage.getItem('copChaseBest') || 0; } catch (e) {}

const JUMP_V = 7.6, GRAV = 22;

function newBuilding(b, z) {
  const cols = ['#3d2c5c', '#4a3470', '#2f2450', '#553a78', '#34285a'];
  b.z = z; b.w = 0.8 + Math.random() * 1.4; b.h = 1.5 + Math.random() * 4.5;
  b.c = cols[(Math.random() * cols.length) | 0];
  b.seed = (Math.random() * 100) | 0; b.gap = 0.1 + Math.random() * 0.6;
  return b;
}
function initBuildings() {
  B = [];
  for (const side of [-1, 1])
    for (let z = 0; z < ZMAX; z += 7) B.push(newBuilding({ side }, z + Math.random() * 4));
}
function reset() {
  time = 0; score = 0; dist = 0; speed = 16; spawnDist = 45; crashT = 0;
  P = { x: 0, lane: 0, py: 0, vy: 0, slide: 0, queue: false, t: 0, fall: 0 };
  C = { x: 0, z: -2.4, t: 0 };
  obstacles = [];
  initBuildings();
}

// ---------- controls ----------
function act(a) {
  if (state !== 'play') return;
  if (a === 'left') P.lane = Math.max(-1, P.lane - 1);
  else if (a === 'right') P.lane = Math.min(1, P.lane + 1);
  else if (a === 'up') { if (P.py === 0) { P.vy = JUMP_V; P.slide = 0; P.queue = false; } }
  else if (a === 'down') { if (P.py > 0) { P.vy = -20; P.queue = true; } else P.slide = 0.65; }
}
function startGame() {
  if (state === 'play' || state === 'caught') return;
  if (state === 'over' && performance.now() - overAt < 600) return;
  reset(); state = 'play'; overlay.style.display = 'none';
}
window.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault();
  if (state !== 'play') {
    if (k === ' ' || k === 'Enter') startGame();
    return;
  }
  if (e.repeat) return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') act('left');
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') act('right');
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') act('up');
  else if (k === 'ArrowDown' || k === 's' || k === 'S') act('down');
});
btn.addEventListener('click', startGame);
let tx = 0, ty = 0;
cv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cv.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) < 25 && Math.abs(dy) < 25) { startGame(); return; }
  if (Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? 'right' : 'left');
  else act(dy < 0 ? 'up' : 'down');
}, { passive: true });

// ---------- spawning ----------
function spawnRow() {
  const n = Math.random() < Math.min(0.15 + time * 0.01, 0.55) ? 2 : 1;
  const lanes = [-1, 0, 1].sort(() => Math.random() - 0.5);
  const types = ['low', 'low', 'high', 'high', 'block'];
  let blockUsed = false;
  for (let i = 0; i < n; i++) {
    let t = types[(Math.random() * types.length) | 0];
    if (t === 'block' && blockUsed) t = 'low';
    if (t === 'block') blockUsed = true;
    obstacles.push({ lane: lanes[i], type: t, z: 85, prev: 85 });
  }
}

// ---------- update ----------
function physics(dt) {
  if (P.py > 0 || P.vy > 0) {
    P.vy -= GRAV * dt; P.py += P.vy * dt;
    if (P.py <= 0) { P.py = 0; P.vy = 0; if (P.queue && state === 'play') { P.queue = false; P.slide = 0.6; } }
  }
  if (P.slide > 0) P.slide -= dt;
}
function scrollWorld(dt) {
  for (const b of B) { b.z -= speed * dt; if (b.z < -4) newBuilding(b, ZMAX + Math.random() * 3); }
}
function crash() {
  state = 'caught'; crashT = 0; P.queue = false;
}
function gameOver() {
  state = 'over'; overAt = performance.now();
  const s = Math.floor(score);
  if (s > best) { best = s; try { localStorage.setItem('copChaseBest', best); } catch (e) {} }
  titleEl.textContent = 'BUSTED!';
  msgEl.className = '';
  msgEl.innerHTML = 'The cop got you.<br><b style="font-size:26px;color:#ffb703">Score: ' + s + '</b><br>Best: ' + best;
  btn.textContent = 'RUN AGAIN';
  overlay.style.display = 'flex';
}
function update(dt) {
  if (state === 'menu') {
    speed = 12; scrollWorld(dt); P.t += dt; C.t += dt; return;
  }
  if (state === 'play') {
    time += dt;
    speed = Math.min(40, 16 + time * 0.4);
    dist += speed * dt;
    score += dt * (8 + speed * 0.3);
    P.x += (P.lane - P.x) * Math.min(1, dt * 14);
    physics(dt);
    P.t += dt * speed / 16;
    C.t += dt * speed / 16;
    C.x += (P.x - C.x) * Math.min(1, dt * 4);
    C.z = -2.4 + Math.sin(time * 3) * 0.15;
    scrollWorld(dt);

    spawnDist -= speed * dt;
    if (spawnDist <= 0) { spawnRow(); spawnDist = speed * (0.9 + Math.random() * 0.7) + 5; }

    for (const o of obstacles) { o.prev = o.z; o.z -= speed * dt; }
    obstacles = obstacles.filter(o => o.z > -4);

    for (const o of obstacles) {
      if (o.z <= 0.7 && o.prev >= -0.6 && Math.abs(o.lane - P.x) < 0.62) {
        let hit;
        if (o.type === 'low') hit = P.py < 0.5;
        else if (o.type === 'high') hit = P.slide <= 0;
        else hit = true;
        if (hit) { crash(); break; }
      }
    }
  } else if (state === 'caught') {
    crashT += dt;
    speed = Math.max(0, speed - 70 * dt);
    physics(dt);
    P.fall = Math.min(1, P.fall + dt * 3);
    C.z = Math.min(-0.9, C.z + dt * 5.5);
    C.x += ((P.x + 0.6) - C.x) * Math.min(1, dt * 8);
    C.t += dt * (C.z < -0.95 ? 1 : 0.2);
    scrollWorld(dt);
    for (const o of obstacles) o.z -= speed * dt;
    if (crashT > 1.1) gameOver();
  }
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
}
function roadQuad(x0, x1, za, zb, color) {
  const sa = sc(za), sb = sc(zb);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(sx(x0, sa), sy(sa)); ctx.lineTo(sx(x1, sa), sy(sa));
  ctx.lineTo(sx(x1, sb), sy(sb)); ctx.lineTo(sx(x0, sb), sy(sb));
  ctx.closePath(); ctx.fill();
}
const fog = z => z > 55 ? Math.max(0, (ZMAX - z) / 35) : 1;

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, HY);
  g.addColorStop(0, '#2b1055'); g.addColorStop(0.6, '#d4507a'); g.addColorStop(1, '#ffb36b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HY + 1);
  // sun
  const sg = ctx.createRadialGradient(CX, HY - H * 0.04, 5, CX, HY - H * 0.04, H * 0.16);
  sg.addColorStop(0, 'rgba(255,240,180,1)'); sg.addColorStop(0.4, 'rgba(255,190,110,.6)'); sg.addColorStop(1, 'rgba(255,150,100,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, HY);
  // far skyline
  ctx.fillStyle = '#3a2358';
  for (const s of skyline) ctx.fillRect(s.x * W, HY - s.h * H, s.w * W + 1, s.h * H);
  // ground
  ctx.fillStyle = '#1f212b'; ctx.fillRect(0, HY, W, H - HY);
  // sidewalks, curbs, road
  roadQuad(-8, -1.7, -4, ZMAX, '#2a2c3a');
  roadQuad(1.7, 8, -4, ZMAX, '#2a2c3a');
  roadQuad(-1.7, -1.55, -4, ZMAX, '#c9c9d4');
  roadQuad(1.55, 1.7, -4, ZMAX, '#c9c9d4');
  roadQuad(-1.55, 1.55, -4, ZMAX, '#3b3f4f');
  const off = dist % 12;
  for (let i = -1; i < ZMAX / 12 + 1; i++) {
    const z0 = i * 12 - off;
    const za = Math.max(z0, -4), zb = z0 + 6;
    if (zb > za) roadQuad(-1.55, 1.55, za, Math.min(zb, ZMAX), '#434859');
  }
  const P8 = 8, off8 = dist % P8;
  for (let i = -1; i < ZMAX / P8 + 1; i++) {
    const z0 = i * P8 - off8, za = Math.max(z0, -4), zb = z0 + 3;
    if (zb > za) for (const lx of [-0.5, 0.5]) roadQuad(lx - 0.03, lx + 0.03, za, Math.min(zb, ZMAX), '#e8e8f0');
  }
  // horizon haze
  const hz = ctx.createLinearGradient(0, HY, 0, HY + (GY - HY) * 0.3);
  hz.addColorStop(0, 'rgba(255,170,120,.8)'); hz.addColorStop(1, 'rgba(255,170,120,0)');
  ctx.fillStyle = hz; ctx.fillRect(0, HY, W, (GY - HY) * 0.3);
}

function drawBuilding(b) {
  const s = sc(b.z), k = U * s, gy = sy(s);
  const inner = 1.95 + b.gap;
  const x0 = b.side < 0 ? sx(-inner - b.w, s) : sx(inner, s);
  const w = b.w * k, h = b.h * k;
  ctx.globalAlpha = fog(b.z);
  ctx.fillStyle = b.c; ctx.fillRect(x0, gy - h, w, h);
  if (k > 12) {
    const cols = Math.floor(b.w / 0.35), rows = Math.floor(b.h / 0.45);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if ((r * 7 + c * 13 + b.seed) % 4 === 0) continue;
      ctx.fillStyle = ((r + c + b.seed) % 3 === 0) ? '#ffd98a' : '#6b5a9a';
      ctx.fillRect(x0 + (c + 0.25) * 0.35 * k, gy - h + (r + 0.3) * 0.45 * k, 0.2 * k, 0.25 * k);
    }
  }
  ctx.globalAlpha = 1;
}

function drawObstacle(o) {
  const s = sc(o.z), k = U * s, gy = sy(s), cx = sx(o.lane, s);
  ctx.globalAlpha = fog(o.z);
  if (o.type === 'low') {
    const w = 0.92 * k, h = 0.5 * k, x = cx - w / 2, y = gy - h;
    ctx.fillStyle = '#f2f2f2'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#e63946';
    const n = 6, bw = w / n;
    for (let i = 0; i < n; i += 2) ctx.fillRect(x + i * bw, y, bw, h);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x, gy - 0.06 * k, w, 0.06 * k);
    ctx.fillStyle = (Math.floor(performance.now() / 250) % 2) ? '#ffb703' : '#7a5200';
    ctx.beginPath(); ctx.arc(cx, y - 0.05 * k, 0.05 * k, 0, 7); ctx.fill();
  } else if (o.type === 'high') {
    const w = 0.96 * k;
    ctx.fillStyle = '#5a5a66';
    ctx.fillRect(cx - w / 2, gy - 1.4 * k, 0.07 * k, 1.4 * k);
    ctx.fillRect(cx + w / 2 - 0.07 * k, gy - 1.4 * k, 0.07 * k, 1.4 * k);
    const y = gy - 1.0 * k, h = 0.3 * k;
    ctx.fillStyle = '#ffd60a'; ctx.fillRect(cx - w / 2, y, w, h);
    ctx.fillStyle = '#1a1a1a';
    const n = 8, bw = w / n;
    for (let i = 0; i < n; i += 2) ctx.fillRect(cx - w / 2 + i * bw, y, bw, h);
  } else {
    const w = 0.92 * k, h = 1.55 * k, x = cx - w / 2, y = gy - h;
    ctx.fillStyle = '#2c6fbb'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#4b8fd8'; ctx.fillRect(x, y, w, 0.12 * k);
    ctx.fillStyle = '#1d4a82'; ctx.fillRect(x, gy - 0.15 * k, w, 0.15 * k);
    ctx.fillStyle = '#f2f2f2'; ctx.fillRect(x, y + h * 0.45, w, 0.1 * k);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = Math.max(1, 0.03 * k);
    ctx.beginPath(); ctx.moveTo(x + 0.08 * k, y + 0.25 * k); ctx.lineTo(x + w - 0.08 * k, y + h * 0.4);
    ctx.moveTo(x + w - 0.08 * k, y + 0.25 * k); ctx.lineTo(x + 0.08 * k, y + h * 0.4); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

const PAL_PLAYER = { skin: '#f1c27d', top: '#ff7a00', pants: '#2b4a9b', hat: '#e63946', hair: '#3b2a20', shoe: '#f5f5f5' };
const PAL_COP = { skin: '#e0ac69', top: '#1f4aa8', pants: '#0c1f4d', hat: '#0b1b46', hair: '#2a2a2a', shoe: '#111', cop: true };

function person(x, gy, k, o) {
  const c = ctx, p = o.pal;
  c.save(); c.translate(x, gy); c.lineCap = 'round';
  if (o.mode === 'fall') c.rotate(o.fall * 1.5);
  if (o.mode === 'slide') {
    c.fillStyle = p.pants;
    for (const sd of [-1, 1]) { rr(sd * 0.1 * k - 0.07 * k, -0.5 * k, 0.14 * k, 0.2 * k, 0.04 * k); }
    c.fillStyle = p.shoe;
    for (const sd of [-1, 1]) c.fillRect(sd * 0.1 * k - 0.07 * k, -0.52 * k, 0.14 * k, 0.06 * k);
    c.fillStyle = p.top; rr(-0.2 * k, -0.3 * k, 0.4 * k, 0.22 * k, 0.06 * k);
    c.fillStyle = p.hair; c.beginPath(); c.arc(0, -0.1 * k, 0.11 * k, 0, 7); c.fill();
    c.fillStyle = p.hat; c.beginPath(); c.arc(0, -0.1 * k, 0.11 * k, Math.PI, 0); c.fill();
    c.restore(); return;
  }
  const ph = o.t * 14, jump = o.mode === 'jump', up = jump || o.mode === 'grab';
  for (let i = 0; i < 2; i++) {
    const lx = (i ? 1 : -1) * 0.1 * k;
    const lift = jump ? 0.22 * k : Math.max(0, Math.sin(ph + i * Math.PI)) * 0.2 * k;
    c.strokeStyle = p.pants; c.lineWidth = 0.15 * k;
    c.beginPath(); c.moveTo(lx, -0.5 * k); c.lineTo(lx, -0.07 * k - lift); c.stroke();
    c.fillStyle = p.shoe; c.fillRect(lx - 0.08 * k, -0.07 * k - lift, 0.16 * k, 0.07 * k);
  }
  c.fillStyle = p.top; rr(-0.19 * k, -0.88 * k, 0.38 * k, 0.42 * k, 0.08 * k);
  if (p.cop) {
    c.fillStyle = '#ffd60a'; c.fillRect(-0.19 * k, -0.7 * k, 0.38 * k, 0.04 * k);
    if (k > 45) {
      c.font = 'bold ' + (0.085 * k) + 'px sans-serif'; c.textAlign = 'center';
      c.fillText('POLICE', 0, -0.76 * k);
    }
  }
  for (let i = 0; i < 2; i++) {
    const sd = i ? 1 : -1, shx = sd * 0.22 * k;
    const hy = up ? -1.05 * k : -0.58 * k + Math.sin(ph + i * Math.PI) * 0.1 * k;
    const hx = up ? sd * 0.28 * k : sd * 0.25 * k;
    c.strokeStyle = p.top; c.lineWidth = 0.1 * k;
    c.beginPath(); c.moveTo(shx, -0.8 * k); c.lineTo(hx, hy); c.stroke();
    c.fillStyle = p.skin; c.beginPath(); c.arc(hx, hy, 0.05 * k, 0, 7); c.fill();
  }
  c.fillStyle = p.hair; c.beginPath(); c.arc(0, -0.98 * k, 0.12 * k, 0, 7); c.fill();
  c.fillStyle = p.hat; c.beginPath(); c.arc(0, -0.99 * k, 0.13 * k, Math.PI, 0); c.closePath(); c.fill();
  if (p.cop) { c.fillStyle = '#f5f5f5'; c.fillRect(-0.13 * k, -1.0 * k, 0.26 * k, 0.025 * k); }
  c.restore();
}

function drawPlayer() {
  const k = U, x = sx(P.x, 1), gy = GY;
  ctx.fillStyle = 'rgba(0,0,0,' + (0.3 / (1 + P.py * 2)) + ')';
  ctx.beginPath(); ctx.ellipse(x, gy, 0.22 * k, 0.06 * k, 0, 0, 7); ctx.fill();
  let mode = 'run';
  if (state === 'caught' || state === 'over') mode = 'fall';
  else if (P.py > 0.02) mode = 'jump';
  else if (P.slide > 0) mode = 'slide';
  person(x, gy - P.py * k, k, { pal: PAL_PLAYER, mode, t: P.t, fall: P.fall });
}
function drawCop() {
  const s = sc(C.z), k = U * s, x = sx(C.x, s), gy = sy(s);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x, gy, 0.22 * k, 0.06 * k, 0, 0, 7); ctx.fill();
  const close = state === 'caught' || state === 'over';
  person(x, gy, k, { pal: PAL_COP, mode: close && C.z > -1.4 ? 'grab' : 'run', t: C.t });
}

function render() {
  ctx.save();
  if (state === 'caught' && crashT < 0.5) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
  drawBackground();
  const list = [];
  for (const b of B) list.push({ z: b.z, f: () => drawBuilding(b) });
  for (const o of obstacles) list.push({ z: o.z, f: () => drawObstacle(o) });
  list.push({ z: 0, f: drawPlayer });
  list.push({ z: C.z, f: drawCop });
  list.sort((a, b) => b.z - a.z);
  for (const d of list) d.f();

  // siren glow
  const flash = Math.floor(performance.now() / 220) % 2;
  const a = (state === 'caught' || state === 'over') ? 0.4 : 0.14;
  const wd = W * 0.35;
  let g = ctx.createLinearGradient(0, 0, wd, 0);
  g.addColorStop(0, flash ? 'rgba(255,0,40,' + a + ')' : 'rgba(30,80,255,' + a + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, wd, H);
  g = ctx.createLinearGradient(W, 0, W - wd, 0);
  g.addColorStop(0, flash ? 'rgba(30,80,255,' + a + ')' : 'rgba(255,0,40,' + a + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(W - wd, 0, wd, H);

  // HUD
  if (state !== 'menu') {
    const fs = Math.round(Math.max(18, W * 0.028));
    ctx.font = '800 ' + fs + 'px system-ui,sans-serif'; ctx.textBaseline = 'top';
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 6;
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + Math.floor(score), 16, 14);
    ctx.fillStyle = '#ffd98a'; ctx.textAlign = 'right';
    ctx.fillText('BEST ' + Math.max(best, Math.floor(score)), W - 16, 14);
    if (state === 'caught') {
      ctx.textAlign = 'center'; ctx.fillStyle = '#ff4d4d';
      ctx.font = '900 ' + Math.round(fs * 2.2) + 'px system-ui,sans-serif';
      ctx.fillText('CAUGHT!', CX, H * 0.18);
    }
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize(); makeSkyline(); reset();
requestAnimationFrame(frame);
})();
</script>
</body>
